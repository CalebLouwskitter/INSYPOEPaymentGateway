server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Note: an add_header inside a location block replaces every add_header inherited from
    # the server block. The locations below therefore avoid add_header, so the security
    # headers at the bottom apply to every response, including JS/CSS and /health.

    # Health check endpoint
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Redirect to HTTPS if TLS is enabled upstream (placeholder for production)
    # return 301 https://$host$request_uri;

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (expires sets Cache-Control: max-age without an add_header)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 1y;
    }

    # Security headers
    # The session token lives in localStorage, so the CSP is the main defence if an XSS bug
    # ever slips in: scripts only from this origin (the Dockerfile disables CRA's inline
    # runtime chunk), no plugins, no framing, and API calls only to the configured backend.
    # Change connect-src to your API origin when deploying somewhere other than localhost.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://localhost:5000 http://localhost:5000; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # The legacy XSS auditor is gone from modern browsers and could itself be abused; 0 turns it off
    add_header X-XSS-Protection "0" always;

    # Example reverse proxy to backend container
    # location /api/ {
    #     proxy_pass http://backend:5000/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
