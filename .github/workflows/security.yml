name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # weekly, so new advisories against unchanged dependencies still get noticed
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests and attack demo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      # Jest starts an in-memory MongoDB (see Backend/test-utils/globalSetup.js)
      - run: npm test
      # Fails the build if any of the scripted attacks gets through
      - run: npm run demo:attacks

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Backend production dependencies (fail on high or critical)
        working-directory: Backend
        run: npm audit --omit=dev --audit-level=high
      # The frontend's high-severity advisories all come from react-scripts' build toolchain
      # (webpack-dev-server, svgo, jest...), which never ships to the browser. Gate on critical
      # here; docs/security-case-study.md tracks the migration off Create React App.
      - name: Frontend dependencies (fail on critical)
        working-directory: Frontend
        run: npm audit --omit=dev --audit-level=critical

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: Static analysis (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
