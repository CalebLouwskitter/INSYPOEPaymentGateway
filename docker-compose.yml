# References:
# Docker Inc. (2025) Docker Compose File Reference. Available at: https://docs.docker.com/compose/compose-file/ (Accessed: 07 January 2025).
# MongoDB, Inc. (2025) MongoDB Official Docker Image. Available at: https://hub.docker.com/_/mongo (Accessed: 07 January 2025).
# Docker Inc. (2025) Docker Compose Healthcheck. Available at: https://docs.docker.com/compose/compose-file/compose-file-v3/#healthcheck (Accessed: 07 January 2025).

version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: insy7314-mongodb
    restart: unless-stopped
    # MongoDB runs without authentication here, so only publish it on the host's loopback
    # interface (for local tools like Compass). The backend reaches it over insy7314-network.
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_DATABASE: insy7314
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    command:
      - mongod
      - --tlsMode
      - requireTLS
      - --tlsCertificateKeyFile
      - /etc/ssl/certs/mongo/mongodb.pem
      - --tlsCAFile
      - /etc/ssl/certs/mongo/ca.pem
      - --tlsAllowConnectionsWithoutCertificates
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init/01-create-app-user.js:/docker-entrypoint-initdb.d/01-create-app-user.js:ro
      - ./certs/mongo:/etc/ssl/certs/mongo:ro
    networks:
      - insy7314-network
    healthcheck:
      test: mongosh --tls --tlsCAFile /etc/ssl/certs/mongo/ca.pem --host localhost -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.adminCommand("ping").ok' --quiet
      interval: 30s
      timeout: 10s
      retries: 5

  # Backend Service
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: insy7314-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://insy7314_app:${MONGO_APP_PASSWORD}@mongodb:27017/insy7314?authSource=insy7314&tls=true&tlsCAFile=/certs/mongo/ca.pem
      - MONGODB_TLS_CA_FILE=/certs/mongo/ca.pem
      - JWT_SECRET=${JWT_SECRET}
      - PORT=5000
      - NODE_ENV=production
    volumes:
      - ./certs/mongo/ca.pem:/certs/mongo/ca.pem:ro
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - insy7314-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Middleware Service
  middleware:
    build:
      context: ./Middleware
      dockerfile: Dockerfile
    container_name: insy7314-middleware
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - BACKEND_URL=http://backend:5000
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - insy7314-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Service
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: insy7314-frontend
    restart: unless-stopped
    # nginx listens on 8080 (non-root, see Frontend/Dockerfile)
    ports:
      - "3000:8080"
    depends_on:
      middleware:
        condition: service_healthy
    networks:
      - insy7314-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  insy7314-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
